# Docs: https://rustic.cli.rs/docs/commands/init/configuration_file.html
# GDrive: https://rustic.cli.rs/docs/commands/init/services.html
# OpenDAL: https://opendal.apache.org/docs/rust/opendal/services/struct.Gdrive.html

[repository]
repository = "opendal:gdrive"
password = "password"

[repository.options]
root = "/ideapad110-homelab"
refresh_token = "token"
client_id = "id"
client_secret = "secret"

[forget]
prune = true
keep-daily = 7
keep-weekly = 4
keep-monthly = 6

[backup]
skip-if-unchanged = true
exclude-if-present = [".nobackup", "CACHEDIR.TAG"]

[[backup.snapshots]]
name = "caddy"
label = "caddy"
sources = [
    "/etc/caddy",
    "/srv/caddy",
]

[[backup.snapshots]]
name = "vaultwarden"
label = "vaultwarden"
sources = [
    "/etc/vaultwarden",
    "/srv/vaultwarden",
]

[[backup.snapshots]]
name = "adguardhome"
label = "adguardhome"
sources = [
    "/etc/adguardhome",
    "/srv/adguardhome",
]

[[backup.snapshots]]
name = "ufw"
label = "ufw"
sources = [
    "/etc/ufw",
]

# Shared rootless quadlets (includes tg-ws-proxy; no /etc or /srv of its own).
[[backup.snapshots]]
name = "quadlets"
label = "quadlets"
sources = [
    "/home/tima/.config/containers/systemd",
]

[[backup.snapshots]]
name = "radicale"
label = "radicale"
sources = [
    "/etc/radicale",
    "/srv/radicale",
]
